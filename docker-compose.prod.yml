services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: fdcl_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/storage/app/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: fdcl_nginx
    restart: unless-stopped
    expose:
      - "8080"                     # tells Coolify/Traefik which port to proxy to
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    container_name: fdcl_db
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - fdcl_mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-focus_lab}"
      MYSQL_USER: "${DB_USERNAME:-focuslab}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fdcl_mysql_data:
