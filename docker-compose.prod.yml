services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: fdcl_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fdcl_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: fdcl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fdcl_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: fdcl_db
    restart: unless-stopped
    volumes:
      - fdcl_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    env_file:
      - .env.prod
    networks:
      - fdcl_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fdcl_mysql_data:

networks:
  fdcl_network:
    driver: bridge